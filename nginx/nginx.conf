# Bind-mounted over /etc/nginx/conf.d/default.conf.
# Nginx is the only process published on the host. Flask has no host port.
# Requests are forwarded to the container name "flask", not an IP address.

server {
    listen 80;
    server_name _;

    # Docker's DNS server. A variable in proxy_pass makes Nginx look up
    # "flask" per request, so a recreated container with a new address still works.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flask_host flask;

    location / {
        proxy_pass http://$flask_host:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
