# Runs on every push to main.
# GitHub provides an Ubuntu runner with Docker. Terraform deploys
# Nginx and Flask on that runner, the job curls the proxy, then destroys
# the containers so the runner is left clean.
name: Deploy and verify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      # Requirement: the workflow builds the application image itself.
      # Terraform then deploys that image with the Nginx proxy.
      - name: Build the Flask image
        run: docker build -t flask-health:latest ./app

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Verify Nginx proxies to Flask
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              curl --fail --silent http://127.0.0.1:8080/
              echo
              exit 0
            fi
            sleep 2
          done
          echo "proxy did not respond"
          exit 1

      # Always destroy, including when the curl check fails.
      - name: Terraform destroy
        if: always()
        run: terraform destroy -auto-approve
